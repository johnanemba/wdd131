
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="Explore a collection of historic and modern temples around the world in this responsive Temple Album by John Anemba.">

    <meta name="author" content="John Anemba">

    <meta name="keywords"
        content="temples, temple album, temple gallery, temple pictures, temple photos">

    <title>Filtered Temple Album | John Anemba</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
        rel="stylesheet">

    <!-- CSS Files -->
    <link rel="stylesheet" href="styles/filtered-temples.css">
    <link rel="stylesheet" href="styles/filtered-temples-large.css"
        media="(min-width: 768px)">

    <!-- JavaScript -->
    <script src="scripts/filtered-temples.js" defer></script>
</head>

<body>

    <header>
        <h1>Filtered Temple Album</h1>

        <button id="menu-toggle"
            class="hamburger"
            type="button"
            aria-label="Open navigation menu"
            aria-expanded="false"
            aria-controls="menu">
            ☰
        </button>

        <nav aria-label="Main navigation">
            <ul id="menu" class="hidden">
                <li><a href="#" data-filter="all">Home</a></li>
                <li><a href="#" data-filter="old">Old</a></li>
                <li><a href="#" data-filter="new">New</a></li>
                <li><a href="#" data-filter="large">Large</a></li>
                <li><a href="#" data-filter="small">Small</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2>Temple Gallery</h2>

        <section id="temple-container"
            class="gallery"
            aria-label="Temple picture collection">
            <!-- Temple cards will be generated dynamically using JavaScript -->
        </section>
    </main>

    <footer>
        <p>&copy; <span id="year"></span> John Anemba</p>
        <p>Last modified: <span id="last-modified"></span></p>
    </footer>

</body>
</html>
