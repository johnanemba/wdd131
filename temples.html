
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="Explore a collection of beautiful temples from around the world in this responsive Temple Album by John Anemba.">

    <meta name="author" content="John Anemba">

    <title>Temple Album | John Anemba</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
        rel="stylesheet">

    <!-- CSS Files -->
    <link rel="stylesheet" href="styles/temples.css">
    <link rel="stylesheet" href="styles/temples-large.css">

    <!-- JavaScript -->
    <script src="scripts/temples.js" defer></script>
</head>

<body>

    <header>
        <h1>Temple Album</h1>

        <button id="menu-toggle"
            class="hamburger"
            type="button"
            aria-label="Open navigation menu"
            aria-expanded="false"
            aria-controls="menu">
            ☰
        </button>

        <nav aria-label="Main navigation">
            <ul id="menu" class="hidden">
                <li><a href="index.html">Home</a></li>
                <li><a href="old.html">Old</a></li>
                <li><a href="new.html">New</a></li>
                <li><a href="large.html">Large</a></li>
                <li><a href="small.html">Small</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2>Temple Gallery</h2>

        <section class="gallery" aria-label="Temple picture collection">

            <figure>
                <img src="images/johberg.jpg"
                    alt="Johannesburg South Africa Temple">
                <figcaption>Johannesburg, South Africa</figcaption>
            </figure>

            <figure>
                <img src="images/images/mesa.jpg"
                    alt="Mesa Arizona Temple">
                <figcaption>Mesa, Arizona</figcaption>
            </figure>

            <figure>
                <img src="images/images/Nauvoo.jpg"
                    alt="Nauvoo Illinois Temple">
                <figcaption>Nauvoo, Illinois</figcaption>
            </figure>

            <figure>
                <img src="images/madridspain.jpg"
                    alt="Madrid Spain Temple">
                <figcaption>Madrid, Spain</figcaption>
            </figure>

            <figure>
                <img src="images/images/Provo.jpg"
                    alt="Provo Utah Temple">
                <figcaption>Provo, Utah</figcaption>
            </figure>

            <figure>
                <img src="images/images/rome.jpg"
                    alt="Rome Italy Temple">
                <figcaption>Rome, Italy</figcaption>
            </figure>

            <figure>
                <img src="images/images/sydney.jpg"
                    alt="Sydney Australia Temple">
                <figcaption>Sydney, Australia</figcaption>
            </figure>

            <figure>
                <img src="images/images/tokyo.jpg"
                    alt="Tokyo Japan Temple">
                <figcaption>Tokyo, Japan</figcaption>
            </figure>

            <figure>
                <img src="images/atlanta.jpg"
                    alt="Atlanta Georgia Temple">
                <figcaption>Atlanta, Georgia</figcaption>
            </figure>

        </section>
    </main>

    <footer>
        <p>&copy; <span id="year"></span> John Anemba</p>
